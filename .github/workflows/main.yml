name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Tests and debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack the newest project zip
        run: |
          ZIP=$(ls PoiExporter_v*_project.zip | sort -V | tail -1)
          echo "Using $ZIP"
          unzip -q "$ZIP" -d project
          ls project

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Core tests (pure Java)
        working-directory: project
        run: |
          mkdir -p build/core build/out
          javac -encoding UTF-8 -d build/core app/src/main/java/iq/gis/poiexporter/core/*.java coretest/*.java
          java -cp build/core WritersTest build/out
          test -s build/out/t.geojson && test -s build/out/t.gpx && test -s build/out/t.dxf
          java -cp build/core AqxTest coretest/sample.aqx

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: project
        run: gradle assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: PoiExporter-debug-apk
          path: project/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
