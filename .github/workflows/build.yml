name: Build APK

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  core-tests:
    name: Core tests (pure Java)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile core and run writer checks
        run: |
          mkdir -p build/core
          javac -encoding UTF-8 -d build/core app/src/main/java/iq/gis/poiexporter/core/*.java coretest/*.java
          mkdir -p build/out
          java -cp build/core WritersTest build/out
          test -s build/out/t.geojson && test -s build/out/t.gpx && test -s build/out/t.dxf
          java -cp build/core AqxTest coretest/sample.aqx

  apk:
    name: Debug APK
    needs: core-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: PoiExporter-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
