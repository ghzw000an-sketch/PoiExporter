name: Build APK

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  apk:
    name: Build Debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          
      - name: Extract Project Zip
        run: |
          # فك الضغط عن الملف الذي يبدأ اسمه بـ PoiExporter إلى مجلد جديد
          unzip PoiExporter*.zip -d extracted_project
          
      - name: Build debug APK
        run: |
          # البحث التلقائي عن مسار مجلد المشروع الفعلي الذي يحتوي على أداة البناء
          GRADLE_DIR=$(dirname $(find extracted_project -name "gradlew" | head -n 1))
          echo "Found project root at: $GRADLE_DIR"
          
          # الدخول للمجلد، إعطاء الصلاحيات، ثم بدء البناء
          cd "$GRADLE_DIR"
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
          
      - uses: actions/upload-artifact@v4
        with:
          name: PoiExporter-debug-apk
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
